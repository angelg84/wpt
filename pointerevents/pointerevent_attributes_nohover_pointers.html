<!doctype html>
<html>
<head>
  <title>Pointer Events properties tests</title>
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" type="text/css" href="pointerevent_styles.css">
  <style>
    body {
      margin: 0;
    }

    html {
      touch-action: none;
    }

    #drag-from, #drag-to {
      background-color: green;
      border: 1px solid black;
      margin: 0;
      padding: 0;
      height: 50px;
      width: 50px;
    }
  </style>
</head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/resources/testdriver.js"></script>
<script src="/resources/testdriver-actions.js"></script>
<script src="/resources/testdriver-vendor.js"></script>
<!-- Additional helper script for common checks across event types -->
<script type="text/javascript" src="pointerevent_support.js"></script>
<script>

  const eventList = [
    'pointerover',
    'pointerenter',
    'pointerdown',
    'pointerup',
    'pointerout',
    'pointerleave',
    'pointermove'
  ];

  window.onload = async () => {

    // Expectations are for the attributes on the first instace of each event.
    const expectations = {
      pointerover: {
        button: 0,
        buttons: 1,
        containingElement: 'drag-from'
      },
      pointerenter: {
        button: 0,
        buttons: 1,
        containingElement: 'drag-from'
      },
      pointerdown: {
        button: 0,
        buttons: 1,
        containingElement: 'drag-from'
      },
      pointermove: {
        button: -1,
        buttons: 1,
        containingElement: 'drag-to'
      },
      pointerup: {
        button: 0,
        buttons: 0,
        containingElement: 'drag-to'
      },
      pointerout: {
        button: 0,
        buttons: 0,
        containingElement: 'drag-to'
      },
      pointerleave: {
        button: 0,
        buttons: 0,
        containingElement: 'drag-to'
      },
    }

    function getExpectation(event_type, attribute) {
      if (!expectations[event_type])
        return undefined;

      return expectations[event_type][attribute];
    }

    function checkPointerEventAttributes(pointer_type, event_type, event) {
      const testPrefix = `${pointer_type}-${event_type}`;
      test(function() {
        assert_equals(event.type, event_type);
      }, `${testPrefix}: type should be ${event_type}`);

      const button = getExpectation(event_type,'button');
      if (button !== undefined) {
        test(function() {
          assert_equals(event.button, button);
        }, `${testPrefix}: button attribute matches expectation`);
      }

      const buttons = getExpectation(event_type,'buttons');
      if (buttons !== undefined) {
        test(function() {
          assert_equals(event.buttons, buttons);
        }, `${testPrefix}: buttons attribute matches expectation`);
      }

      // Bounding rect of element must contain (clienX, clientY).
      const containingElement =
          getExpectation(event_type, 'containingElement');
      if (containingElement) {
        const element = document.getElementById(containingElement);
        const boundingRect = element.getBoundingClientRect();
        test(function() {
          assert_true(
              boundingRect.left <= event.clientX &&
              boundingRect.right >= event.clientX);
        }, `${testPrefix}: clientX is within the expected range`);
        test(function() {
          assert_true(
              boundingRect.top <= event.clientY &&
              boundingRect.bottom >= event.clientY);
        }, `${testPrefix}: clientY is within the expected range`);
      }

      check_PointerEvent(event, testPrefix);

      // Test isPrimary
      test(function () {
        assert_equals(event.isPrimary, true);
      }, `${testPrefix}: isPrimary attribute is true.`);

      return event.pointerId;
    }

    async function runPointerTest(test_fixture, pointer_type) {
      const listeners = {};
      let expected_pointer_id = undefined;
      // check_PointerEvent expects that the event target is not the root
      // document.
      const target = document.getElementById('wrapper');
      eventList.forEach(type => {
        const listener = (event) => {
          const pointer_id =
              checkPointerEventAttributes(pointer_type, type, event);
          if (expected_pointer_id === undefined) {
             expected_pointer_id = pointer_id;
          } else {
            const testPrefix = `${pointer_type}-${type}`;
            const message =
                'pointerId should be the same as previous pointer events for ' +
                'this active pointer.';
            test(function () {
              assert_equals(event.pointerId, expected_pointer_id);
            }, `${testPrefix}: ${message}`);
          }

          target.removeEventListener(type, listener);
          delete listeners[type];
        }
        target.addEventListener(type, listener);
        listeners[type] = listener;
      });
      test_fixture.add_cleanup(() => {
        for (key in listeners) {
          target.removeEventListener(key, listeners[key]);
        }
      });

      // Trigger gesture.
      const dragFrom = document.getElementById('drag-from');
      const dragTo = document.getElementById('drag-to');
      await new test_driver.Actions()
        .addPointer('pointer1', pointer_type)
        .pointerMove(0, 0, {origin: dragFrom})
        .pointerDown()
        .addTick()
        .addTick()
        .pointerMove(0, 0, {origin: dragTo})
        .addTick()
        .addTick()
        .pointerUp()
        .send();

      assert_equals(Object.keys(listeners).length, 0,
                    `Missing tests for ${Object.keys(listeners).join(', ')}`);
    }

    promise_test(t => {
      return runPointerTest(t, 'touch');
    }, 'Attributes on touch pointer events.');

  };
</script>
<body>
  <div id="wrapper">
    <div id="drag-from"></div>
    <div id="drag-to"></div>
  </div>
</body>
</html>
