<!DOCTYPE html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/utils.js"></script>
<title>Unknown href causes the whole document to be blocked</title>

<link rel=expect href="#first" blocking="render">
<script>

  promise_test(() => {
    return new Promise((resolve, reject) => {
      requestAnimationFrame(() => {
        if (!document.getElementById("third"))
          reject("third not parsed");
        else if (!document.getElementById("last"))
          reject("last not parsed");
        else
          resolve();
      });
    });
  }, "blocking defers frames until removed");
</script>
</head>
<body>
  <div id="notfirst"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="second"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="third"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="fourth"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="last"></div>
</body>
