<!DOCTYPE html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/utils.js"></script>
<title>Adding an id to parsed element satisfies render block</title>

<link rel=expect href="#first" blocking="render">
<script>

  promise_test(() => {
    return new Promise((resolve, reject) => {
      requestAnimationFrame(() => {
        if (!document.getElementById("first"))
          reject("first not parsed");
        else if (document.getElementById("last"))
          reject("last unexpectedly parsed");
        else
          resolve();
      });
    });
  }, "blocking defers frames until removed");
</script>
</head>
<body>
  <div id="willbefirst"></div>
  <script>
    willbefirst.id = "first";
    jankMany(100, 10);
  </script>
  <div id="second"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="third"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="fourth"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="last"></div>
</body>
