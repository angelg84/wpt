<!DOCTYPE html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/utils.js"></script>
<title>Media attribute that doesn't match makes the link not apply</title>

<link rel=expect href="#last" blocking="render" media="(max-width: 10px)">
<script>
promise_test(() => {
  return new Promise((resolve, reject) => {
    requestAnimationFrame(() => {
      if (!document.getElementById("last"))
        resolve();
      else
        reject("last unexpectedly parsed");
    });
  });
}, "blocking defers frames until removed");
</script>
</head>
<body>
  <div id="first"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="second"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="last"></div>
</body>
