<!DOCTYPE html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/utils.js"></script>
<title>Frames starts after href element is parsed before the end</title>

<link rel=expect href="#third" blocking="render">
<script>

  promise_test(() => {
    return new Promise((resolve, reject) => {
      requestAnimationFrame(() => {
        if (!document.getElementById("third"))
          reject("third not parsed");
        else if (document.getElementById("last"))
          reject("last unexpectedly");
        else
          resolve();
      });
    });
  }, "blocking defers frames until removed");
</script>
</head>
<body>
  <div id="first"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="second"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="third"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="fourth"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="last"></div>
</body>
