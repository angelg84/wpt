<!DOCTYPE html>
<head>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="support/utils.js"></script>
<title>Removing id keeps render block satisfied</title>

<link rel=expect href="#first" blocking="render">
<script>

  promise_test(() => {
    return new Promise((resolve, reject) => {
      requestAnimationFrame(() => {
        if (document.getElementById("last"))
          reject("last unexpected parsed");
        else
          resolve();
      });
    });
  }, "blocking defers frames until removed");
</script>
</head>
<body>
  <div id="first"></div>
  <script>
    first.id = "wasfirst";
    jankMany(100, 10);
  </script>
  <div id="second"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="third"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="fourth"></div>
  <script>
    jankMany(100, 10);
  </script>
  <div id="last"></div>
</body>
